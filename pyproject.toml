[project]
name = "larpscaler"
version = "0.3.0"
description = "Standalone, text-encoder-free inference for the LarpScaler image upscaler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2",
  "diffusers>=0.38.0,<0.39",
  "huggingface-hub>=0.27",
  "pillow>=10.0",
  "safetensors>=0.5",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["ipywidgets>=8.0", "jupyterlab>=4.0"]
paper = ["pypdfium2>=4.30", "reportlab>=4.0"]

[project.scripts]
larpscale = "larpscaler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larpscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
